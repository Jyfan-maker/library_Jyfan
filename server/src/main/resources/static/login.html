<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 图书管理系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-head">
      <div class="login-logo">图</div>
      <h1>图书管理系统</h1>
      <p>Database Course Design · 范记永 2024003296</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <label>用户名</label>
      <input id="username" type="text" placeholder="请输入用户名" value="admin" required>
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码" value="123456" required>
      <button type="submit" id="loginBtn">登 录</button>
    </form>
    <div class="login-tip">默认账号：admin / 123456（管理员）　fanjiyong / 123456（读者）</div>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const res = await post('/api/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });
        if (res.code === 0) {
          location.href = 'index.html';
        } else {
          toast(res.msg || '登录失败', true);
          btn.disabled = false; btn.textContent = '登 录';
        }
      } catch (err) {
        toast('网络错误：' + err.message, true);
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
    // 已登录则直接进主页
    get('/api/me').then(function (res) {
      if (res.code === 0) location.href = 'index.html';
    }).catch(function () {});
  </script>
</body>
</html>
